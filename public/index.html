<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SentinEx | Dashboard</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        
        :root {
            --bg-body: #f3f4f6;
            --bg-sidebar: #111827;
            --bg-card: #ffffff;
            --text-main: #111827;
            --text-muted: #6b7280;
            --primary: #2563eb;
            --success: #059669;
            --danger: #dc2626;
            --warning: #d97706;
            --border: #e5e7eb;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
        body { background-color: var(--bg-body); color: var(--text-main); display: flex; height: 100vh; overflow: hidden; }

        /* Sidebar */
        .sidebar { width: 260px; background: var(--bg-sidebar); color: white; display: flex; flex-direction: column; }
        .logo { padding: 24px; font-size: 24px; font-weight: 700; letter-spacing: -0.5px; border-bottom: 1px solid #1f2937; }
        .logo span { color: #60a5fa; }
        .nav-links { padding: 20px 12px; flex: 1; }
        .nav-link { display: flex; align-items: center; padding: 12px 16px; color: #9ca3af; text-decoration: none; border-radius: 8px; margin-bottom: 8px; font-weight: 500; transition: 0.2s; }
        .nav-link:hover, .nav-link.active { background: #1f2937; color: white; }
        .nav-link.active { border-left: 4px solid var(--primary); }

        /* Main Content */
        .main-content { flex: 1; display: flex; flex-direction: column; overflow-y: auto; }
        .topbar { background: var(--bg-card); height: 70px; display: flex; align-items: center; justify-content: space-between; padding: 0 32px; border-bottom: 1px solid var(--border); }
        .topbar h2 { font-size: 20px; font-weight: 600; }
        .status-indicator { display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 600; color: var(--success); background: #ecfdf5; padding: 6px 12px; border-radius: 20px; }
        .dot { width: 8px; height: 8px; background: var(--success); border-radius: 50%; animation: pulse 2s infinite; }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.4; } 100% { opacity: 1; } }

        .dashboard-container { padding: 32px; max-width: 1200px; margin: 0 auto; width: 100%; }
        
        /* Stat Cards */
        .stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 24px; margin-bottom: 32px; }
        .stat-card { background: var(--bg-card); padding: 24px; border-radius: 12px; border: 1px solid var(--border); box-shadow: 0 1px 2px rgba(0,0,0,0.05); }
        .stat-title { font-size: 14px; color: var(--text-muted); font-weight: 500; margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.5px; }
        .stat-value { font-size: 32px; font-weight: 700; color: var(--text-main); }

        /* Table */
        .table-container { background: var(--bg-card); border-radius: 12px; border: 1px solid var(--border); box-shadow: 0 1px 2px rgba(0,0,0,0.05); overflow: hidden; }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 16px 24px; text-align: left; border-bottom: 1px solid var(--border); }
        th { background: #f9fafb; font-size: 12px; font-weight: 600; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; }
        td { font-size: 14px; font-weight: 500; }
        tr:last-child td { border-bottom: none; }
        tr:hover { background: #f9fafb; }

        /* Badges */
        .badge { padding: 4px 12px; border-radius: 20px; font-size: 12px; font-weight: 600; }
        .badge-granted { background: #ecfdf5; color: var(--success); }
        .badge-denied { background: #fef2f2; color: var(--danger); }
        
        /* Warning Icon */
        .warning-icon { color: var(--warning); cursor: pointer; margin-left: 8px; font-size: 16px; }
        .warning-icon:hover::after { content: "Duplicate Scan!"; position: absolute; background: #111; color: #fff; padding: 4px 8px; border-radius: 4px; font-size: 12px; transform: translate(-50%, -100%); margin-top: -8px; }
    </style>
</head>
<body>
    <!-- Sidebar -->
    <aside class="sidebar">
        <div class="logo">Sentin<span>Ex</span></div>
        <div class="nav-links">
            <a href="#" class="nav-link active">📊 Dashboard</a>
            <a href="#" class="nav-link">👥 Students</a>
            <a href="#" class="nav-link">📝 Attendance Logs</a>
            <a href="#" class="nav-link">⚙️ Settings</a>
        </div>
    </aside>

    <!-- Main Content -->
    <main class="main-content">
        <header class="topbar">
            <h2>Attendance Overview</h2>
            <div class="status-indicator"><div class="dot"></div> Live System</div>
        </header>

        <div class="dashboard-container">
            <!-- Stats -->
            <div class="stats-grid">
                <div class="stat-card">
                    <div class="stat-title">Total Scans Today</div>
                    <div class="stat-value" id="total-scans">0</div>
                </div>
                <div class="stat-card">
                    <div class="stat-title">Unique Students</div>
                    <div class="stat-value" id="unique-students">0</div>
                </div>
                <div class="stat-card">
                    <div class="stat-title">Security Alerts</div>
                    <div class="stat-value" id="security-alerts" style="color: var(--danger);">0</div>
                </div>
            </div>

            <!-- Table -->
            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>Student Name</th>
                            <th>ID</th>
                            <th>Timestamp</th>
                            <th>Status</th>
                        </tr>
                    </thead>
                    <tbody id="log-body">
                        <tr><td colspan="4" style="text-align:center; color: var(--text-muted);">Loading secure records...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <script>
        async function fetchLogs() {
            try {
                const response = await fetch('/api/logs');
                const data = await response.json();
                const tbody = document.getElementById('log-body');
                
                // Update Stats
                document.getElementById('total-scans').innerText = data.length;
                const uniqueIds = new Set(data.map(log => log.fingerprint_id));
                document.getElementById('unique-students').innerText = uniqueIds.size;
                document.getElementById('security-alerts').innerText = data.filter(l => l.status === 'Denied').length;

                if (data.length === 0) {
                    tbody.innerHTML = `<tr><td colspan="4" style="text-align:center; color: var(--text-muted);">No records found.</td></tr>`;
                    return;
                }

                tbody.innerHTML = data.map(log => {
                    const date = new Date(log.scanned_at).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
                    const dateStr = new Date(log.scanned_at).toLocaleDateString();
                    const badgeClass = log.status === 'Granted' ? 'badge-granted' : 'badge-denied';
                    
                    // Check if duplicate (scan_count > 1)
                    const warning = (log.scan_count > 1) ? `<span class="warning-icon" title="Scanned ${log.scan_count} times today!">⚠️</span>` : '';

                    return `
                        <tr>
                            <td><strong>${log.student_name}</strong> ${warning}</td>
                            <td>#${log.fingerprint_id}</td>
                            <td>${dateStr} at ${date}</td>
                            <td><span class="badge ${badgeClass}">${log.status}</span></td>
                        </tr>
                    `;
                }).join('');
            } catch (err) {
                console.error("Error fetching logs:", err);
            }
        }

        setInterval(fetchLogs, 2000);
        fetchLogs();
    </script>
</body>
</html>
